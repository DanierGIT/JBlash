<?xml version="1.0" encoding="UTF-8"?>
<svg id="eylen-dm-footer-logo" viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logotipo Corporativo EYLEN-DM TECH & SOFT">
  <defs>
    <linearGradient id="eylen-metal-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
