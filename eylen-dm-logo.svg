    <text x="400" y="436" text-anchor="middle" fill="#B8C7D9" font-family="'Montserrat','Inter','Segoe UI',Arial,sans-serif" font-weight="700" font-size="23" letter-spacing="5.5">TECH &amp; SOFT</text>
    <text x="400" y="476" text-anchor="middle" fill="#9FB1C6" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="500" font-size="14.5" letter-spacing="4.2">THINK. BUILD. EVOLVE.</text>
