      <line x1="326" y1="294" x2="346" y2="144" />
      <line x1="326" y1="294" x2="380" y2="286" />
      <line x1="326" y1="294" x2="406" y2="316" />
      <line x1="402" y1="202" x2="346" y2="144" stroke-opacity="0.4" />
